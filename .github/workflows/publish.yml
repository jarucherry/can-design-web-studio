# Publishes the site to GitHub Pages on every push to main — including the
# commits admin.html makes when the owner presses "เผยแพร่ขึ้นเว็บ".
# tools/build-seo.js runs first, so the search-engine copy in index.html,
# the article pages, sitemap.xml and llms.txt always match content.js.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-seo.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow: tells Bing (which ChatGPT search and Copilot use), Yandex and
      # others that the pages in sitemap.xml changed. The key is the .txt file
      # named after it at the site root; it only proves the site is ours.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          KEY=$(ls | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          BASE=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | head -1 | sed 's/<[^>]*>//g')
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | sed 's/.*/"&"/' | paste -sd, -)
          HOST=$(echo "$BASE" | sed -E 's#https?://([^/]+)/.*#\1#')
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"${BASE}${KEY}.txt\",\"urlList\":[$URLS]}"
